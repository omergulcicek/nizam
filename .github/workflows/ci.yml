name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "templates/**"
      - "templates-i18n/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "templates/**"
      - "templates-i18n/**"
      - ".github/workflows/ci.yml"

jobs:
  templates:
    name: Template CI (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - templates/nextjs
          - templates/tanstack
          - templates-i18n/nextjs
          - templates-i18n/tanstack

    defaults:
      run:
        working-directory: ${{ matrix.template }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Paraglide
        if: contains(matrix.template, 'i18n/tanstack')
        run: pnpm exec paraglide-js compile --project ./project.inlang

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:ci

      - name: Knip
        run: pnpm run knip

      - name: Prepare environment
        run: cp .env.example .env.local

      - name: Build
        run: pnpm run build
